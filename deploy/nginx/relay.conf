# Relay site nginx config (ticket d2282133): an allowlist in front of the
# Vite dev server on :3000. Only public files the app actually serves are
# proxied through; Vite internal paths and dotfiles are blocked outright.
# The Vite dev server is exposed through nginx on port 80, and /.git/config
# was served with HTTP 200 before this change (ticket f1c9079c).
#
# Live path: /etc/nginx/conf.d/relay.conf on dylannet-2.
# Apply:   sudo cp deploy/nginx/relay.conf /etc/nginx/conf.d/relay.conf \
#          && sudo nginx -t && sudo systemctl reload nginx
# Rollback: sudo cp /etc/nginx/conf.d/relay.conf.bak-20261122 \
#           /etc/nginx/conf.d/relay.conf && sudo nginx -t \
#           && sudo systemctl reload nginx
# The 3-hour auto-update (relay-auto-update.sh) pulls main and restarts
# the app only; it never touches nginx, so this file is the source of
# truth for re-applying the allowlist after any VM rebuild.
server {
    listen 80 default_server;
    server_name 129.146.97.44;

    # Relay main-branch zip (Nov 12) — public file, keep.
    location = /relay-main-2026-11-12.zip {
        alias /usr/share/nginx/html/relay-main-2026-11-12.zip;
    }

    # Block Vite internal paths outright (regex locations win over the
    # prefix locations below): /@fs/ reads arbitrary files off disk,
    # /@id/ transforms arbitrary modules (the f1c9079c import-glob
    # probe came in through /@id/).
    location ~ ^/@(fs|id)(/|$) {
        return 404;
    }

    # Block dotfiles and dot-directories: /.git/, /.env, /.ftpconfig,
    # /.svn/, and anything else starting with a dot. /.git/config was
    # served with 200 before this change (f1c9079c).
    location ~ ^/\. {
        return 404;
    }

    # Public allowlist — exactly what the app was observed requesting
    # (nginx access log, Nov 2026) plus /api. Everything else falls
    # through to the final location and gets 404.
    location = / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /favicon.ico {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /@vite/client {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /@react-refresh {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /src/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Pre-bundled dependencies (react, react-dom, marked, chunks).
    # The ticket lists /node_modules/.vite/ as a path to block, but the
    # app cannot run without these files — allowlist conflict, resolved
    # in favour of the observed traffic. Everything else under
    # /node_modules/ is blocked by the final location.
    location /node_modules/.vite/deps/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Vite client env module, requested by /@vite/client (200/304 in
    # the access log). A fixed public file from the vite package.
    location = /node_modules/vite/dist/client/env.mjs {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # API: Vite proxies /api to the backend on :8890 (changeOrigin
    # false; the backend uses Host for the prompt bundle base URL).
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default deny: anything not listed above gets 404.
    location / {
        return 404;
    }
}
